<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folder Assistant</title>
<style>
:root {
  --ground: #F3F3F3; --layer: #F9F9F9; --card: #FFFFFF; --subtle: #FAFAFA;
  --line: #E5E5E5; --line-soft: #F0F0F0; --line-strong: #D1D1D1;
  --text: #1B1B1B; --text-2: #5F5F5F; --text-off: #A0A0A0;
  --accent: #005FB8; --accent-border: #1A5FA8; --on-accent: #FFFFFF;
  --info-bg: #F6F9FE; --info: #005FB8;
  --caution-bg: #FFF4CE; --caution: #9D5D00;
  --success-bg: #DFF6DD; --success: #0F7B0F;
  --error-bg: #FDE7E9; --error: #C42B1C;
  --folder: #C49A2F;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ground: #202020; --layer: #272727; --card: #2D2D2D; --subtle: #2B2B2B;
    --line: #3A3A3A; --line-soft: #333333; --line-strong: #3A3A3A;
    --text: #FFFFFF; --text-2: #CFCFCF; --text-off: #8A8A8A;
    --accent: #4CC2FF; --accent-border: #60CDFF; --on-accent: #000000;
    --info-bg: #2B2B2B; --info: #4CC2FF;
    --caution-bg: #433519; --caution: #E4B55E;
    --success-bg: #393D1B; --success: #6CCB5F;
    --error-bg: #442726; --error: #FF99A4;
    --folder: #E4B55E;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; font-size: 14px;
  color: var(--text); background: var(--ground); display: flex; flex-direction: column;
}
button, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.mono { font-family: "Cascadia Mono", Consolas, monospace; font-size: 12.5px; }
.muted { color: var(--text-2); }
svg { flex: none; }

header { height: 44px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 16px; }
.logo { width: 18px; height: 18px; border-radius: 4px; background: var(--accent); display: flex; align-items: center; justify-content: center; }
header .name { font-size: 13px; }
.chip { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-2); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); }

.layer { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--layer);
  border-top: 1px solid var(--line); }
main { flex: 1; min-height: 0; overflow-y: auto; }
.page { max-width: 1000px; margin: 0 auto; padding: 26px 32px 24px; display: flex; flex-direction: column; gap: 16px; }
h1 { margin: 0; font-size: 28px; font-weight: 600; }
h2 { margin: 0; font-size: 20px; font-weight: 600; }
.lead { margin: 6px 0 0; line-height: 1.5; color: var(--text-2); max-width: 640px; }
.label { font-weight: 600; margin-bottom: 8px; }

.card { background: var(--card); border: 1px solid var(--line); border-bottom-color: var(--line-strong); border-radius: 4px; }
.bar { border: 1px solid var(--line); border-radius: 4px; padding: 11px 13px; display: flex; gap: 11px; align-items: flex-start; }
.bar .title { font-weight: 600; }
.bar .body { font-size: 13px; line-height: 1.5; color: var(--text-2); margin-top: 2px; white-space: pre-wrap; }
.bar > svg { margin-top: 2px; }
.bar.info { background: var(--info-bg); } .bar.info > svg { stroke: var(--info); }
.bar.caution { background: var(--caution-bg); } .bar.caution > svg { stroke: var(--caution); }
.bar.success { background: var(--success-bg); } .bar.success > svg { stroke: var(--success); }
.bar.error { background: var(--error-bg); } .bar.error > svg { stroke: var(--error); }
.bar .grow { flex: 1; min-width: 0; }

.examples { display: flex; flex-direction: column; gap: 3px; }
.example { text-align: left; width: 100%; padding: 11px 14px; display: flex; align-items: center; gap: 14px; }
.example:hover { background: var(--subtle); }
.example .hint { display: block; font-size: 12px; color: var(--text-2); margin-top: 2px; }

.btn { height: 34px; padding: 0 16px; border-radius: 4px; font-size: 14px; display: inline-flex; align-items: center; gap: 8px;
  background: var(--card); border: 1px solid var(--line); border-bottom-color: var(--line-strong); }
.btn:hover { background: var(--subtle); }
.btn.primary { background: var(--accent); border-color: var(--accent-border); color: var(--on-accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .5; cursor: default; filter: none; }
.link { border: 0; background: none; padding: 0; color: var(--accent); font-size: 12px; }

.you { align-self: flex-end; max-width: 80%; background: var(--accent); color: var(--on-accent); border-radius: 8px 8px 2px 8px; padding: 8px 12px; white-space: pre-wrap; }
.reply { padding: 12px 14px; display: flex; gap: 11px; }
.reply .text { line-height: 1.55; white-space: pre-wrap; min-width: 0; }
.meta { font-size: 12.5px; color: var(--text-2); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: -8px; }

.changes { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 720px; }
th { text-align: left; font-weight: 400; font-size: 12px; color: var(--text-2); padding: 9px 10px; border-bottom: 1px solid var(--line); }
td { padding: 9px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; font-size: 13px; }
tr:last-child td { border-bottom: 0; }
td.why { color: var(--text-2); font-size: 12.5px; }
.act { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
tr.off td { color: var(--text-off); background: var(--subtle); }
tr.off .file { text-decoration: line-through; }
tr:not(.off) .del { color: var(--error); }
input[type=checkbox] { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); cursor: pointer; }
.nowrap { white-space: nowrap; }
.snippet { font-size: 12px; color: var(--text-2); margin-top: 3px; font-family: inherit; }
.target { height: 34px; width: 210px; padding: 0 10px; font: inherit; font-size: 13px; color: inherit; background: var(--card);
  border: 1px solid var(--line); border-bottom: 1px solid var(--text-2); border-radius: 4px; }
.target:focus { outline: none; border-bottom: 2px solid var(--accent); }
.commands { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.commands .grow { flex: 1; min-width: 200px; font-size: 13px; color: var(--text-2); }

.working { display: flex; align-items: center; gap: 12px; color: var(--text-2); }
.spinner { width: 18px; height: 18px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.composer { flex: none; border-top: 1px solid var(--line); padding: 12px 32px 14px; }
.composer .inner { max-width: 936px; margin: 0 auto; }  /* lines up with .page content (1000px - 2 x 32px) */
.composer label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 6px; }
.composer .row { display: flex; gap: 8px; align-items: flex-end; }
textarea { flex: 1; resize: none; font-size: 14px; line-height: 1.45; padding: 7px 11px; background: var(--card);
  border: 1px solid var(--line); border-bottom: 1px solid var(--text-2); border-radius: 4px; }
textarea:focus { outline: none; border-bottom: 2px solid var(--accent); }
footer { height: 28px; flex: none; border-top: 1px solid var(--line); background: var(--ground); padding: 0 32px;
  display: flex; align-items: center; gap: 18px; font-size: 12px; color: var(--text-2); }
footer .grow { flex: 1; }
@media (max-width: 640px) {
  .page, .composer { padding-left: 16px; padding-right: 16px; }
  footer { padding: 0 16px; } footer .hide-small { display: none; }
}
</style>
</head>
<body>
<header>
  <div class="logo"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--on-accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></div>
  <span class="name">Folder Assistant</span>
  <span class="chip"><span class="dot"></span><span id="model">…</span></span>
</header>

<div class="layer">
  <main><div class="page" id="page"></div></main>

  <div class="composer"><div class="inner">
    <label for="request">Your request</label>
    <div class="row">
      <textarea id="request" rows="2" placeholder="e.g. sort my downloads folder into subfolders, don't delete anything"></textarea>
      <button class="btn primary" id="send" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>Send
      </button>
    </div>
  </div></div>

  <footer>
    <span id="status">Ready</span>
    <span class="mono hide-small" id="base"></span>
    <span class="grow"></span>
    <span class="hide-small">Deletes go to the Recycle Bin</span>
    <button class="link" id="undo" type="button">Undo last run</button>
  </footer>
</div>

<script>
const TOKEN = "__TOKEN__";
const ICONS = {
  folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  move: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 13h6M12.5 10.5l2.5 2.5-2.5 2.5"/>',
  rename: '<path d="M4 20h4L20 8l-4-4L4 16z"/>',
  delete: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M12 11v5"/>',
  caution: '<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/>',
  check: '<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>',
  error: '<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>',
  chat: '<path d="M4 5h16v11a2 2 0 0 1-2 2H9l-5 3z"/>',
  chevron: '<path d="M9 5l7 7-7 7"/>',
  apply: '<path d="M4 12.5l5 5L20 6.5"/>',
  undo: '<path d="M3 10h10a5 5 0 1 1 0 10H8"/><path d="M3 10l4-4M3 10l4 4"/>',
  search: '<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',
};
const ACTIONS = { move: ["Move", "move"], "move+rename": ["Move + rename", "move"], rename: ["Rename", "rename"],
                  delete: ["Delete", "delete"] };

// Builds elements with textContent only: file names and model text never become HTML.
function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "class") e.className = v;
    else e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k);
  return e;
}
function icon(name, size = 16, color = "currentColor") {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  for (const [k, v] of Object.entries({ width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: color,
      "stroke-width": 1.9, "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true" })) s.setAttribute(k, v);
  s.innerHTML = ICONS[name];  // fixed markup from ICONS above
  return s;
}
function bar(kind, title, body, ...extra) {
  return el("div", { class: "bar " + kind, role: kind === "error" || kind === "caution" ? "alert" : "status" },
    icon({ info: "info", caution: "caution", success: "check", error: "error" }[kind]),
    el("div", { class: "grow" }, el("div", { class: "title" }, title), body ? el("div", { class: "body" }, body) : null),
    ...extra);
}
function plural(n, word) { return n + " " + word + (n === 1 ? "" : "s"); }
function size(kb) { return kb >= 1024 * 1024 ? (kb / 1048576).toFixed(1) + " GB" : kb >= 1024 ? (kb / 1024).toFixed(1) + " MB" : Math.round(kb) + " KB"; }

async function api(path, body = {}) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-Token": TOKEN },
                                body: JSON.stringify(body) });
  if (!r.ok) throw new Error("The app answered " + r.status);
  return r.json();
}

const page = document.getElementById("page"), input = document.getElementById("request");
const sendBtn = document.getElementById("send"), statusEl = document.getElementById("status");
let info = null, busy = false;

function show(...nodes) { page.replaceChildren(...nodes.filter(Boolean)); document.querySelector("main").scrollTop = 0; }
function setBusy(on, text) {
  busy = on; sendBtn.disabled = on; document.getElementById("undo").disabled = on;
  statusEl.textContent = text || "Ready";
}

function home() {
  show(
    el("div", {}, el("h1", {}, "New request"),
      el("p", { class: "lead" }, "Name a folder and say what you want done. The files are read on this PC, you get an " +
        "explanation and a preview of every change, and nothing is written until you choose Apply.")),
    info && info.sandbox ? bar("info", "Folder names point at the test sandbox",
      "“Downloads” means sandbox\\Downloads, not your real folder. Start without --base sandbox when you are ready.") : null,
    el("div", {}, el("div", { class: "label" }, "Start from an example"),
      el("div", { class: "examples" }, (info ? info.examples : []).map(x =>
        el("button", { class: "card example", type: "button", onclick: () => send(x.text) },
          icon("chat", 18, "var(--accent)"),
          el("span", { style: "flex:1;min-width:0" }, el("span", {}, x.text), el("span", { class: "hint" }, x.hint)),
          icon("chevron", 14, "var(--text-2)"))))));
}

async function send(text) {
  text = (text ?? input.value).trim();
  if (!text || busy) return;
  input.value = "";
  const you = el("div", { class: "you" }, text);
  const working = el("span", {}, "Reading the folder and asking the model… this can take up to a minute.");
  show(you, el("div", { class: "working" }, el("div", { class: "spinner" }), working));
  setBusy(true, "Working…");
  // big folders go to the model in parts: show which one it is on
  const timer = setInterval(() => api("/api/progress").then(p => { if (p.text) working.textContent = p.text; }).catch(() => {}), 1000);
  try {
    const r = await api("/api/run", { text });
    if (r.error) show(you, bar("error", "Something went wrong", r.error));
    else result(you, r);
  } catch (e) {
    show(you, bar("error", "The app is not answering", "Is app.py still running? " + e.message));
  } finally {
    clearInterval(timer);
  }
  setBusy(false);
}

function result(you, r) {
  const total = r.seconds.reduce((a, b) => a + b, 0).toFixed(1);
  const meta = el("div", { class: "meta" },
    r.folder ? [icon("folder", 13, "var(--folder)"), el("span", { class: "mono" }, r.folder), el("span", {}, "·")] : null,
    el("span", {}, "answered in " + total + "s"));
  const reply = r.text ? el("div", { class: "card reply" },
    el("div", { class: "logo", style: "width:22px;height:22px" }, icon("chat", 13, "var(--on-accent)")),
    el("div", { class: "text" }, r.text)) : null;

  if (r.kind === "ask") return show(you, bar("info", "Which folder do you mean?", r.text), meta);
  if (r.kind === "refuse") return show(you, bar("caution", "I won't do that", r.text), meta);
  if (r.kind === "error") return show(you, bar("error", "No usable answer this time", r.text + "\nNothing was touched. Ask again."), meta);
  if (r.kind === "explain" && r.question) return show(you, reply, meta);  // an answer, not a plan
  if (r.kind === "explain") return show(you, reply, meta, bar("info", "Nothing proposed", "Nothing on disk has changed."));
  if (r.kind === "search") return searchResults(you, reply, meta, r);

  const blocked = r.blocked.length ? bar("caution",
    plural(r.blocked.length, "change") + " blocked by the safety rules",
    r.blocked.map(b => b.action + " " + b.file + " — " + b.why).join("\n")) : null;
  if (!r.steps.length) return show(you, reply, meta, blocked, bar("info", "No changes to make", "Nothing on disk has changed."));

  const on = new Set(r.steps.map(s => s.i));
  const applyBtn = el("button", { class: "btn primary", type: "button" }, icon("apply", 15), el("span"));
  const count = el("span", { class: "muted", style: "font-size:12.5px" });
  const all = el("input", { type: "checkbox", checked: "", "aria-label": "Select all" });
  const boxes = [];
  const update = () => {
    applyBtn.lastChild.textContent = on.size ? "Apply " + plural(on.size, "change") : "Nothing selected";
    applyBtn.disabled = !on.size;
    count.textContent = on.size + " selected of " + r.steps.length + " proposed";
    all.checked = on.size === r.steps.length;
    all.indeterminate = on.size > 0 && on.size < r.steps.length;
  };
  all.addEventListener("change", () => {
    for (const [box, tr, i] of boxes) { box.checked = all.checked; all.checked ? on.add(i) : on.delete(i); tr.classList.toggle("off", !all.checked); }
    update();
  });
  const kinds = {};
  for (const s of r.steps) { const k = s.action === "delete" ? "delete" : s.action === "rename" ? "rename" : "move"; kinds[k] = (kinds[k] || 0) + 1; }
  const deletes = kinds.delete || 0;
  const summary = r.steps.length > 8 ? el("div", { class: "muted", style: "font-size:13px;margin-top:-8px" },
    [kinds.move ? plural(kinds.move, "move") : "", kinds.rename ? plural(kinds.rename, "rename") : "",
     deletes ? plural(deletes, "delete") : ""].filter(Boolean).join(", ") + ".") : null;
  const warn = deletes >= 10 ? bar("caution", plural(deletes, "file") + " will go to the Recycle Bin",
    "Check the list before you apply. Untick anything you want to keep.") : null;
  const rows = r.steps.map(s => {
    const [label, ic] = ACTIONS[s.action];
    const id = "chg-" + s.i;
    const box = el("input", { type: "checkbox", id, checked: "", onchange: e => {
        e.target.checked ? on.add(s.i) : on.delete(s.i); tr.classList.toggle("off", !e.target.checked); update(); } });
    const tr = el("tr", {},
      el("td", { style: "width:34px" }, box),
      el("td", {}, el("label", { for: id, class: "act" + (s.action === "delete" ? " del" : "") },
        icon(ic, 15, s.action === "delete" ? "var(--error)" : "var(--accent)"), label)),
      el("td", { class: "mono file" }, s.file),
      el("td", { class: "mono" + (s.action === "delete" ? " del" : " muted") }, s.target),
      el("td", { class: "why" }, s.reason));
    boxes.push([box, tr, s.i]);
    return tr;
  });
  applyBtn.addEventListener("click", () => applyPlan(you, [...on]));
  update();
  show(you, reply, meta, blocked, warn,
    el("div", { style: "display:flex;align-items:flex-end;gap:12px" }, el("h2", { style: "flex:1" }, "Review before anything is written"), count),
    summary,
    el("div", { class: "card changes" }, el("table", {},
      el("thead", {}, el("tr", {}, el("th", {}, all), el("th", {}, "Action"), el("th", {}, "File"), el("th", {}, "Goes to"), el("th", {}, "Why"))),
      el("tbody", {}, rows))),
    el("div", { class: "commands" },
      el("span", { class: "grow" }, "Nothing has been written yet. Deletes go to the Recycle Bin, and the run is logged so it can be undone."),
      applyBtn, el("button", { class: "btn", type: "button", onclick: home }, "Cancel")));
}

function searchResults(you, reply, meta, r) {
  if (!r.matches.length) return show(you, reply, meta);
  const on = new Set(), boxes = [];
  const note = el("div");
  const count = el("span", { class: "muted", style: "font-size:12.5px" });
  const all = el("input", { type: "checkbox", "aria-label": "Select all" });
  const delBtn = el("button", { class: "btn", type: "button" }, icon("delete", 15, "var(--error)"), el("span"));
  const moveBtn = el("button", { class: "btn", type: "button" }, icon("move", 15, "var(--accent)"), "Move to");
  const target = el("input", { type: "text", class: "target", placeholder: "a folder, e.g. Documents/CVs", "aria-label": "Folder to move to" });
  const update = () => {
    count.textContent = on.size + " of " + r.matches.length + " selected";
    delBtn.disabled = moveBtn.disabled = !on.size;
    delBtn.lastChild.textContent = on.size ? "Delete " + plural(on.size, "file") : "Delete";
    all.checked = on.size === r.matches.length;
    all.indeterminate = on.size > 0 && on.size < r.matches.length;
  };
  all.addEventListener("change", () => {
    for (const [box, i] of boxes) { box.checked = all.checked; all.checked ? on.add(i) : on.delete(i); }
    update();
  });
  const rows = r.matches.map(m => {
    const id = "res-" + m.i;
    const box = el("input", { type: "checkbox", id, onchange: e => { e.target.checked ? on.add(m.i) : on.delete(m.i); update(); } });
    boxes.push([box, m.i]);
    return el("tr", {},
      el("td", { style: "width:34px" }, box),
      el("td", {}, el("label", { for: id, class: "mono file" }, m.name), m.snippet ? el("div", { class: "snippet" }, m.snippet) : null),
      el("td", { class: "mono muted" }, m.where),
      el("td", { class: "muted nowrap" }, size(m.size_kb)),
      el("td", { class: "muted nowrap" }, m.modified),
      el("td", { class: "why" }, m.why),
      el("td", {}, el("button", { class: "link nowrap", type: "button", onclick: () => api("/api/open", { i: m.i })
        .then(x => note.replaceChildren(x.error ? bar("error", "Couldn't open the folder", x.error) : ""))
        .catch(e => note.replaceChildren(bar("error", "The app is not answering", e.message))) }, "Show in folder")));
  });
  const act = async (action) => {
    if (busy) return;
    setBusy(true, "Preparing…");
    try {
      const x = await api("/api/act", { selected: [...on], action, to: target.value });
      if (x.error) note.replaceChildren(bar("error", "Nothing prepared", x.error));
      else result(el("div", { class: "you" }, action === "delete" ? "Delete the files I picked" : "Move the files I picked to " + target.value), x);
    } catch (e) {
      note.replaceChildren(bar("error", "The app is not answering", e.message));
    }
    setBusy(false);
  };
  delBtn.addEventListener("click", () => act("delete"));
  moveBtn.addEventListener("click", () => act("move"));
  target.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); act("move"); } });
  update();
  show(you, reply, meta, note,
    el("div", { style: "display:flex;align-items:flex-end;gap:12px" }, el("h2", { style: "flex:1" }, "Files found"), count),
    el("div", { class: "card changes" }, el("table", {},
      el("thead", {}, el("tr", {}, el("th", {}, all), el("th", {}, "File"), el("th", {}, "Folder"), el("th", {}, "Size"),
        el("th", {}, "Changed"), el("th", {}, "Why it matched"), el("th"))),
      el("tbody", {}, rows))),
    el("div", { class: "commands" },
      el("span", { class: "grow" }, "Tick files to delete or move them. You'll see a preview first, and nothing changes until you apply it."),
      delBtn, target, moveBtn));
}

async function applyPlan(you, selected) {
  setBusy(true, "Applying…");
  try {
    const r = await api("/api/apply", { selected });
    if (r.error) show(you, bar("error", "Not applied", r.error));
    else {
      const parts = [r.moved ? plural(r.moved, "file") + " moved" : "", r.recycled ? plural(r.recycled, "file") + " sent to the Recycle Bin" : ""];
      show(bar("success", plural(r.moved + r.recycled, "change") + " applied to " + r.folder,
        parts.filter(Boolean).join(", ") + ".\nUndo log: " + r.log,
        el("button", { class: "btn", type: "button", onclick: undo }, icon("undo", 15), "Undo this run")),
        el("div", {}, el("button", { class: "btn", type: "button", onclick: home }, "New request")));
    }
  } catch (e) {
    show(bar("error", "The app is not answering", "Is app.py still running? " + e.message));
  }
  setBusy(false);
}

async function undo() {
  if (busy) return;
  setBusy(true, "Undoing…");
  try {
    const r = await api("/api/undo");
    show(bar(r.error ? "error" : "info", r.error ? "Undo failed" : "Undo", r.error || r.message),
      el("div", {}, el("button", { class: "btn", type: "button", onclick: home }, "New request")));
  } catch (e) {
    show(bar("error", "The app is not answering", e.message));
  }
  setBusy(false);
}

sendBtn.addEventListener("click", () => send());
document.getElementById("undo").addEventListener("click", undo);
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });

api("/api/info").then(r => {
  info = r;
  document.getElementById("model").textContent = r.model;
  document.getElementById("base").textContent = r.base;
  home();
}).catch(e => show(bar("error", "The app is not answering", e.message)));
home();
</script>
