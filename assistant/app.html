<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folder Assistant</title>
<style>
/* Figtree is served by app.py from assistant/fonts (SIL Open Font License): nothing is loaded from the internet. */
@font-face { font-family: "Figtree"; font-style: normal; font-weight: 300 900; font-display: swap;
  src: url(/fonts/figtree-latin.woff2) format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Figtree"; font-style: normal; font-weight: 300 900; font-display: swap;
  src: url(/fonts/figtree-latin-ext.woff2) format("woff2");
  unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }

/* Folder Assistant design system: tokens */
:root {
  --bg: #f6f6f4; --surface: #ffffff; --text: #1a1a1c; --text-muted: #5f6066;
  --line: #e5e5e2; --line-strong: #86878d;
  --accent: #1d5bbf; --on-accent: #ffffff; --accent-tint: #eaf1fc; --delete: #b3361a;
  --folder: #f3c457; --folder-back: #dca43a; --folder-edge: #9a6a10; --file-paper: #ffffff; --file-edge: #86878d;
  --type-pdf: #c0392b; --type-image: #1f7a52; --type-doc: #2f62c4; --type-app: #55595f; --type-text: #7c6418; --on-type: #ffffff;
  --font-sans: "Figtree", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 40px;
  --radius-sm: 5px; --radius-md: 8px; --radius-lg: 12px; --radius-pill: 999px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121313; --surface: #1c1d1f; --text: #ececed; --text-muted: #a3a4aa;
    --line: #2d2e31; --line-strong: #6f7076;
    --accent: #8db5ff; --on-accent: #0f1726; --accent-tint: #1b2638; --delete: #ff8c6b;
    --folder: #e2b24a; --folder-back: #b8892c; --folder-edge: #e2b24a; --file-paper: #2b2c30; --file-edge: #8a8b91;
    --type-pdf: #ff8a80; --type-image: #6fd39a; --type-doc: #8db5ff; --type-app: #b9bcc6; --type-text: #d9bf7a; --on-type: #121313;
    color-scheme: dark;
  }
}
html, body { margin: 0; min-height: 100%; }
[hidden] { display: none !important; }

.fa { font-family: var(--font-sans); font-size: 15px; line-height: 22px; color: var(--text); background: var(--bg); }
.fa *, .fa *::before, .fa *::after { box-sizing: border-box; }
.fa :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.fa-title { margin: 0; font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -.01em; }
.fa-small { font-size: 13px; line-height: 18px; }
.fa-muted { color: var(--text-muted); }
.fa-del { color: var(--delete); }

/* top bar */
.fa-top { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: var(--space-4); min-height: 60px;
  padding: 10px var(--space-5); border-bottom: 1px solid var(--line); background: var(--surface); }
.fa-top .name { font-weight: 700; white-space: nowrap; }
.fa-top .grow { flex: 1; }

/* buttons */
.fa-btn { appearance: none; font: inherit; font-weight: 600; height: 40px; padding: 0 18px; display: inline-flex; align-items: center; gap: var(--space-2);
  border-radius: var(--radius-md); border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); cursor: pointer; white-space: nowrap; }
.fa-btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.fa-btn:disabled, .fa-btn.primary:disabled { background: transparent; border: 1px dashed var(--line-strong); color: var(--text-muted); cursor: default; }
.fa-link { appearance: none; background: none; border: 0; padding: 0; font: inherit; font-size: 14px; color: var(--text-muted);
  text-decoration: underline; text-underline-offset: 3px; cursor: pointer; white-space: nowrap; }
.fa-link:disabled { cursor: default; text-decoration: none; }

/* checkbox */
.fa-check { appearance: none; -webkit-appearance: none; flex: none; width: 18px; height: 18px; margin: 0; position: relative; cursor: pointer;
  border: 1.5px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface); }
.fa-check:checked, .fa-check:indeterminate { background: var(--accent); border-color: var(--accent); }
.fa-check:checked::after { content: ""; position: absolute; left: 4.5px; top: 1px; width: 5px; height: 10px;
  border: solid var(--on-accent); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.fa-check:indeterminate::after { content: ""; position: absolute; left: 3px; top: 6.75px; width: 9px; height: 2px; background: var(--on-accent); }

/* request box */
.fa-request { display: flex; gap: var(--space-2); flex: 1; max-width: 620px; min-width: 0; }
.fa-input { flex: 1; min-width: 0; height: 40px; padding: 0 14px; font: inherit; color: var(--text); background: var(--surface);
  border: 1px solid var(--line-strong); border-radius: var(--radius-md); }
.fa-input::placeholder { color: var(--text-muted); opacity: 1; }
.fa-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

/* pills */
.fa-pill { display: inline-block; padding: 0 7px; border-radius: var(--radius-pill); font-size: 11.5px; line-height: 17px; font-weight: 600; }
.fa-pill.new { background: var(--accent-tint); color: var(--accent); }
.fa-pill.renamed { border: 1px solid var(--line-strong); color: var(--text-muted); line-height: 15px; }

/* icons */
.fa-ic { display: block; flex: none; overflow: visible; }
.fa-ic .back { fill: var(--folder-back); stroke: var(--folder-edge); stroke-width: 1; }
.fa-ic .front { fill: var(--folder); stroke: var(--folder-edge); stroke-width: 1; }
.fa-ic .paper { fill: var(--file-paper); stroke: var(--file-edge); stroke-width: 1.2; }
.fa-ic .fold { fill: none; stroke: var(--file-edge); stroke-width: 1.2; stroke-linejoin: round; }
.fa-ic .band { fill: var(--type-doc); }
.fa-ic .band.pdf { fill: var(--type-pdf); }
.fa-ic .band.image { fill: var(--type-image); }
.fa-ic .band.app { fill: var(--type-app); }
.fa-ic .band.text { fill: var(--type-text); }
.fa-ic .tag { fill: var(--on-type); font-family: var(--font-sans); font-size: 7.5px; font-weight: 700; letter-spacing: .3px; }
.fa-ic .bin { fill: none; stroke: var(--delete); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

/* the page */
.fv-wrap { max-width: 1100px; margin: 0 auto; padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-4); }
.fv-head p { margin: 2px 0 0; }
.fv-cols { display: grid; grid-template-columns: 340px 28px minmax(0, 1fr); align-items: stretch; }
.fv-arrow { display: grid; place-items: center; color: var(--text-muted); font-size: 18px; }
.fv-cols.done { grid-template-columns: minmax(0, 1fr); }
.fv-cols.done .fv-arrow, .fv-cols.done .fv-win.now { display: none; }

/* a window */
.fv-win { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.fv-bar { display: flex; align-items: center; gap: var(--space-2); min-height: 46px; padding: 0 var(--space-4); border-bottom: 1px solid var(--line); white-space: nowrap; }
.fv-bar .which { font-weight: 600; margin-right: var(--space-2); }
.fv-bar .grow { flex: 1; }
.fv-bar .where { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.fv-crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; }
.fv-crumbs button { appearance: none; background: none; border: 0; padding: 2px 4px; margin: 0 -4px; font: inherit; color: var(--text); cursor: pointer; border-radius: 4px; }
.fv-crumbs button:hover { background: var(--accent-tint); }
.fv-crumbs .sep { color: var(--text-muted); }
.fv-back { appearance: none; width: 28px; height: 28px; margin-left: -6px; border-radius: var(--radius-md); border: 0; background: none; color: var(--text);
  font: inherit; font-size: 18px; line-height: 1; cursor: pointer; display: grid; place-items: center; }
.fv-back:hover { background: var(--accent-tint); }
.fv-back:disabled { color: var(--line-strong); cursor: default; background: none; }
.fv-status { margin-top: auto; display: flex; align-items: center; gap: var(--space-2); min-height: 40px; padding: 9px var(--space-4); border-top: 1px solid var(--line);
  font-size: 13px; line-height: 18px; color: var(--text-muted); overflow-wrap: anywhere; }
.fv-status b { color: var(--text); font-weight: 600; }
.fv-text { padding: var(--space-4); white-space: pre-wrap; overflow-wrap: anywhere; }
.fv-text.say { max-height: 260px; overflow-y: auto; }

/* Now: a list */
.fv-list { list-style: none; margin: 0; padding: 6px 0; max-height: 560px; overflow-y: auto; }
.fv-row { display: flex; align-items: center; gap: var(--space-3); padding: 7px var(--space-4); cursor: pointer; }
.fv-row:hover { background: var(--accent-tint); }
.fv-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.fv-row .to { font-size: 13px; line-height: 18px; color: var(--text-muted); white-space: nowrap; max-width: 45%; overflow: hidden; text-overflow: ellipsis; }
.fv-row.off .nm { color: var(--text-muted); text-decoration: line-through; }
.fv-row.kept { cursor: default; }
.fv-row .spacer { width: 18px; flex: none; }
.fv-more { padding: 7px var(--space-4); font-size: 13px; line-height: 18px; color: var(--text-muted); }

/* examples on the first screen */
.fv-ex { appearance: none; width: 100%; text-align: left; font: inherit; color: var(--text); background: none; border: 0;
  display: flex; flex-direction: column; padding: 10px var(--space-4); cursor: pointer; }
.fv-ex:hover { background: var(--accent-tint); }
.fv-ex + .fv-ex { border-top: 1px solid var(--line); }

/* search results */
.fv-res { align-items: flex-start; }
.fv-res .fa-check, .fv-res .fa-ic { margin-top: 2px; }
.fv-res .body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.fv-res .body .nm { flex: none; }
.fv-res .meta { font-size: 13px; line-height: 18px; color: var(--text-muted); overflow-wrap: anywhere; }
.fv-res .snippet { font-size: 13px; line-height: 18px; color: var(--text-muted); font-style: italic; overflow-wrap: anywhere; }

/* After: big icons */
.fv-body { max-height: 560px; overflow-y: auto; }
.fv-grid { display: grid; grid-template-columns: repeat(auto-fill, 116px); gap: var(--space-2); padding: var(--space-4); align-content: start; }
.fv-tile { appearance: none; font: inherit; color: var(--text); background: none; border: 1px solid transparent; border-radius: var(--radius-md);
  padding: 10px 6px 8px; display: flex; flex-direction: column; align-items: center; gap: var(--space-1); cursor: default; text-align: center; min-width: 0; }
.fv-tile:hover { background: var(--accent-tint); }
.fv-tile.sel { background: var(--accent-tint); border-color: var(--accent); }
.fv-tile .nm { font-size: 13px; line-height: 17px; font-weight: 500; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.fv-tile .sub { font-size: 12px; line-height: 16px; color: var(--text-muted); }
.fv-bin { display: flex; align-items: center; gap: var(--space-3); margin: 0 var(--space-4) var(--space-4); padding: 10px var(--space-3);
  border: 1px dashed var(--line-strong); border-radius: var(--radius-md); font-size: 13px; line-height: 18px; overflow-wrap: anywhere; }
.fv-empty { padding: var(--space-5) var(--space-4); color: var(--text-muted); font-size: 14px; }

/* bottom actions */
.fv-actions { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
.fv-actions .grow { flex: 1; min-width: 220px; font-size: 14px; line-height: 20px; color: var(--text-muted); }
.fv-actions .grow b { color: var(--text); font-weight: 600; }
.fv-actions .fa-input { flex: 0 1 260px; }
.fv-done { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; padding: 12px var(--space-4); border-radius: var(--radius-lg); background: var(--accent-tint); }
.fv-done .grow { flex: 1; min-width: 220px; }
.fv-done .log { display: block; font-size: 13px; line-height: 18px; color: var(--text-muted); overflow-wrap: anywhere; }
.fv-note { padding: 10px var(--space-4); border: 1px dashed var(--line-strong); border-radius: var(--radius-md); font-size: 14px; line-height: 20px; overflow-wrap: anywhere; }
.fv-note:empty { display: none; }
.fv-note b { font-weight: 600; }

@media (max-width: 820px) {
  .fa-top { flex-wrap: wrap; padding: 10px var(--space-4); }
  .fa-request { order: 5; flex-basis: 100%; max-width: none; }
  .fv-wrap { padding: var(--space-4); }
  .fv-cols { grid-template-columns: minmax(0, 1fr); gap: var(--space-2); }
  .fv-arrow { transform: rotate(90deg); }
}
</style>
</head>
<body class="fa">
<header class="fa-top">
  <span class="name">Folder Assistant</span>
  <form class="fa-request" id="form">
    <input class="fa-input" id="request" autocomplete="off" aria-label="Request"
           placeholder="e.g. organise downloads, don’t delete anything">
    <button class="fa-btn" id="send" type="submit">Send</button>
  </form>
  <span class="grow"></span>
  <span class="fa-small fa-muted" id="sandbox" hidden
        title="Folder names point at the test sandbox: “Downloads” means sandbox\Downloads, not your real folder.">Test sandbox</span>
  <button class="fa-link" id="undo" type="button">Undo last run</button>
</header>
<main class="fv-wrap" id="main"></main>

<script>
const TOKEN = "__TOKEN__";

// ---- icons: a folder, a file page with a coloured label band, the Recycle Bin
const SVG = "http://www.w3.org/2000/svg";
const SHAPES = {
  folder: '<path class="back" d="M4.5 11a3 3 0 0 1 3-3h10.2l4 4H40.5a3 3 0 0 1 3 3v22a3 3 0 0 1-3 3h-33a3 3 0 0 1-3-3z"/>' +
          '<path class="front" d="M4.5 19a3 3 0 0 1 3-3h33a3 3 0 0 1 3 3v18a3 3 0 0 1-3 3h-33a3 3 0 0 1-3-3z"/>',
  file: '<path class="paper" d="M11.5 4.5h17l10 10v27a2 2 0 0 1-2 2h-25a2 2 0 0 1-2-2v-35a2 2 0 0 1 2-2z"/>' +
        '<path class="fold" d="M28.5 4.5v8a2 2 0 0 0 2 2h8"/>',
  bin: '<path class="bin" d="M11 13h26M20 13V9.5h8V13M14.5 13l2 26a2 2 0 0 0 2 1.8h11a2 2 0 0 0 2-1.8l2-26M21 19v15M27 19v15"/>'
};
const KINDS = { pdf: ["pdf"], image: ["jpg", "jpeg", "png", "gif", "bmp", "webp", "heic", "svg"], app: ["exe", "msi"],
                text: ["txt", "csv", "log", "md", "json"] };
function extOf(name) { const m = /\.([^.\\/]+)$/.exec(name || ""); return m ? m[1].toLowerCase() : ""; }
function kindOf(name) {
  const ext = extOf(name);
  for (const [k, exts] of Object.entries(KINDS)) if (exts.includes(ext)) return k;
  return "doc";  // anything unknown
}
// kind "folder", "bin", or a file name: its extension picks the band colour and goes on the band
function icon(kind, size) {
  const s = document.createElementNS(SVG, "svg");
  for (const [k, v] of Object.entries({ viewBox: "0 0 48 48", width: size, height: size, class: "fa-ic", "aria-hidden": "true" })) s.setAttribute(k, v);
  if (kind === "folder" || kind === "bin") { s.innerHTML = SHAPES[kind]; return s; }  // fixed markup from SHAPES
  s.innerHTML = SHAPES.file + '<rect class="band ' + kindOf(kind) + '" x="5" y="26" width="28" height="11" rx="2"/>';
  const t = document.createElementNS(SVG, "text");
  for (const [k, v] of Object.entries({ class: "tag", x: "19", y: "34.3", "text-anchor": "middle" })) t.setAttribute(k, v);
  t.textContent = (extOf(kind) || "file").slice(0, 4).toUpperCase();
  s.append(t);
  return s;
}

// Builds elements with textContent only: file names and model text never become HTML.
function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "class") e.className = v;
    else e.setAttribute(k, v);
  }
  return fill(e, ...kids);
}
function fill(node, ...kids) { node.replaceChildren(...kids.flat(Infinity).filter(k => k != null && k !== false && k !== "")); return node; }
function plural(n, word) { return n + " " + word + (n === 1 ? "" : "s"); }
function size(kb) { return kb >= 1048576 ? (kb / 1048576).toFixed(1) + " GB" : kb >= 1024 ? (kb / 1024).toFixed(1) + " MB" : Math.round(kb) + " KB"; }
function lastPart(path) { return (path || "").split(/[\\/]/).filter(Boolean).pop() || path || ""; }
function lower1(text) { return text ? text.charAt(0).toLowerCase() + text.slice(1) : ""; }

async function api(path, body = {}) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-Token": TOKEN },
                                body: JSON.stringify(body) });
  if (!r.ok) throw new Error("The app answered " + r.status);
  return r.json();
}

const main = document.getElementById("main"), input = document.getElementById("request");
const sendBtn = document.getElementById("send"), undoBtn = document.getElementById("undo");
let info = null, busy = false;

function show(...nodes) { fill(main, ...nodes); window.scrollTo(0, 0); }
function setBusy(on) { busy = on; sendBtn.disabled = undoBtn.disabled = on; }
function head(title, sub) {
  return el("div", { class: "fv-head" }, el("h1", { class: "fa-title" }, title), sub ? el("p", { class: "fa-small fa-muted" }, sub) : null);
}
// a plain window with the assistant's words in it
function say(label, text, folder, seconds) {
  return el("section", { class: "fv-win" },
    el("div", { class: "fv-bar" }, el("span", { class: "which" }, label), folder ? el("span", { class: "fa-muted where", title: folder }, folder) : null,
      el("span", { class: "grow" }), seconds ? el("span", { class: "fa-small fa-muted" }, seconds) : null),
    el("div", { class: "fv-text say" }, text));
}
function newRequest() {
  return el("div", { class: "fv-actions" }, el("span", { class: "grow" }),
    el("button", { class: "fa-btn", type: "button", onclick: () => { home(); input.select(); input.focus(); } }, "New request"));
}
function notAnswering(e) { show(head("The app is not answering", "Is app.py still running? " + e.message)); }

// ---- first screen
function home() {
  show(head("What should I do?", "Name a folder and say what you want done. The files are read on this PC, you see the folder " +
         "before and after, and nothing changes until you press Apply."),
    el("section", { class: "fv-win" },
      el("div", { class: "fv-bar" }, el("span", { class: "which" }, "Try one of these")),
      (info ? info.examples : []).map(x => el("button", { class: "fv-ex", type: "button", onclick: () => send(x.text) },
        el("span", {}, x.text), el("span", { class: "fa-small fa-muted" }, x.hint)))),
    info ? el("p", { class: "fa-small fa-muted", style: "margin:0" }, "Model: " + info.model + " · Folders under: " + info.base +
      " · Deletes go to the Recycle Bin.") : null);
}

// ---- a request
async function send(text) {
  text = (text ?? input.value).trim();
  if (!text || busy) return;
  input.value = text;
  const progress = el("span", {}, "Reading the folder and asking the model.");
  const clock = el("span", { class: "fa-small fa-muted" }, "0 s");
  show(head("Working on it", "This can take up to a minute. Nothing on disk changes until you press Apply."),
    el("section", { class: "fv-win" },
      el("div", { class: "fv-bar" }, el("span", { class: "which" }, "Your request"), el("span", { class: "grow" }), clock),
      el("div", { class: "fv-text" }, text),
      el("div", { class: "fv-status" }, progress)));
  setBusy(true);
  const started = Date.now();
  // big folders go to the model in parts: show which one it is on
  const timer = setInterval(() => {
    clock.textContent = Math.round((Date.now() - started) / 1000) + " s";
    api("/api/progress").then(p => { if (p.text) progress.textContent = p.text; }).catch(() => {});
  }, 1000);
  try {
    const r = await api("/api/run", { text });
    if (r.error) show(head("Something went wrong", r.error), newRequest());
    else result(r);
  } catch (e) {
    notAnswering(e);
  } finally {
    clearInterval(timer);
    setBusy(false);
  }
}

function result(r) {
  const seconds = r.seconds.length ? "answered in " + r.seconds.reduce((a, b) => a + b, 0).toFixed(1) + " s" : "";
  if (r.kind === "ask") {
    show(head("Which folder do you mean?", "Type it in the request box at the top, for example “organise downloads”."),
      say("Assistant", r.text, r.folder, seconds));
    input.select(); input.focus();
    return;
  }
  if (r.kind === "refuse") return show(head("I won’t do that", "Nothing on disk has changed."), say("Assistant", r.text, r.folder, seconds), newRequest());
  if (r.kind === "error") return show(head("No usable answer this time", "Nothing was touched. Ask again."),
    r.text ? say("Assistant", r.text, r.folder, seconds) : null, newRequest());
  if (r.kind === "explain" && r.question) return show(head("Here’s what I found", null), say("Answer", r.text, r.folder, seconds), newRequest());
  if (r.kind === "explain") return show(head("Here’s what’s in " + lastPart(r.folder), "Nothing on disk has changed."),
    say("Assistant", r.text, r.folder, seconds), newRequest());
  if (r.kind === "search") return searchView(r, seconds);
  if (!r.steps.length && !r.blocked.length) return show(head("No changes to make", "Nothing on disk has changed."),
    r.text ? say("Assistant", r.text, r.folder, seconds) : null, newRequest());
  planView(r, seconds);
}

// ---- the main screen: the folder now on the left, and how it will look after the plan on the right
function planView(r, seconds) {
  const where = r.folder, here = lastPart(where) || where;
  const ent = r.here || { files: [], folders: [], exists: true };
  const items = r.steps.map(s => ({ i: s.i, name: s.name, label: s.file, bin: s.action === "delete", toDir: s.to_dir,
    as: s.new_name !== s.name ? s.new_name : null, out: s.action !== "delete" && s.to_dir == null ? s.target : null,
    fromHere: s.from_here, why: s.reason, on: true }));
  const kept = r.blocked.map(b => ({ name: lastPart(b.file), label: b.file, kept: b.why }));
  const st = { done: null, open: null, select: null, nowInfo: null };
  const shown = f => f.as || f.name;
  const key = n => n.toLowerCase();  // Windows file names ignore case
  const planned = new Set([...items.filter(f => f.fromHere).map(f => key(f.name)), ...kept.map(k => key(k.name))]);
  const others = ent.files.filter(n => !planned.has(key(n)));

  // the After window is worked out from the ticks, never asked of the model again
  function after() {
    const gone = new Set(items.filter(f => f.on && f.fromHere).map(f => key(f.name)));
    const existing = new Map(ent.folders.map(d => [key(d), { name: d, isNew: false, items: [] }]));
    const fresh = [], loose = [], bin = [], out = [];
    for (const f of items) {
      if (!f.on) continue;
      if (f.bin) bin.push(f);
      else if (f.out != null) out.push(f);
      else if (!f.toDir) loose.push(f);  // renamed in place, or (picked files) moved into this folder
      else {
        const top = f.toDir.split("/")[0];
        let d = existing.get(key(top)) || fresh.find(x => key(x.name) === key(top));
        if (!d) fresh.push(d = { name: top, isNew: true, items: [] });
        d.items.push(f);
      }
    }
    const byName = new Map(items.filter(f => f.fromHere).map(f => [key(f.name), f]));
    const keptBy = new Map(kept.map(k => [key(k.name), k]));
    const stay = ent.files.filter(n => !gone.has(key(n))).map(n => ({ name: n, f: byName.get(key(n)), k: keptBy.get(key(n)) }));
    stay.sort((a, b) => (!!(b.f || b.k) - !!(a.f || a.k)));  // the ones the plan is about first
    return { folders: [...fresh, ...existing.values()], fresh, loose, stay, bin, out };
  }

  // Now window: one row per file in the plan, the ones the safety rules kept, then the rest of the folder
  const now = el("section", { class: "fv-win now" });
  const all = el("input", { type: "checkbox", class: "fa-check", "aria-label": "Select all" });
  const list = el("ul", { class: "fv-list" });
  const nowStatus = el("div", { class: "fv-status" });
  for (const f of items) {
    const box = el("input", { type: "checkbox", class: "fa-check", "aria-label": (f.bin ? "Delete " : "Change ") + f.label });
    box.checked = true;
    box.addEventListener("change", () => {
      f.on = box.checked;
      st.select = f.on ? (f.toDir ? "d:" + f.toDir.split("/")[0] : f.bin || f.out != null ? null : "f:" + shown(f)) : "f:" + f.name;
      st.open = null;
      draw();
    });
    f.box = box;
    f.to = el("span", { class: "to" });
    f.row = el("label", { class: "fv-row", title: f.why || "" }, box, icon(f.label, 22), el("span", { class: "nm" }, f.label), f.to);
    f.row.addEventListener("click", () => { st.nowInfo = f; drawNowStatus(); });
    list.append(el("li", {}, f.row));
  }
  for (const k of kept) {
    const row = el("div", { class: "fv-row kept", title: "Stays: " + k.kept }, el("span", { class: "spacer" }), icon(k.label, 22),
      el("span", { class: "nm" }, k.label), el("span", { class: "to" }, "stays"));
    row.addEventListener("click", () => { st.nowInfo = k; drawNowStatus(); });
    list.append(el("li", {}, row));
  }
  const room = Math.max(0, 40 - items.length - kept.length);
  for (const n of others.slice(0, room)) {
    list.append(el("li", {}, el("div", { class: "fv-row kept" }, el("span", { class: "spacer" }), icon(n, 22),
      el("span", { class: "nm" }, n), el("span", { class: "to" }, "stays"))));
  }
  if (others.length > room) list.append(el("li", { class: "fv-more" }, plural(others.length - room, "other file") + " stay as they are."));
  all.checked = true;
  all.addEventListener("change", () => { for (const f of items) f.on = all.checked; st.select = st.open = null; draw(); });
  now.append(
    el("div", { class: "fv-bar" }, items.length ? all : null, el("span", { class: "which" }, "Now"),
      el("span", { class: "fa-muted where", title: where }, r.picked ? "the files you picked" : where), el("span", { class: "grow" }),
      el("span", { class: "fa-small fa-muted" }, plural(items.length + kept.length + (r.picked ? 0 : others.length), "item"))),
    list, nowStatus);

  function drawNowStatus() {
    const x = st.nowInfo;
    if (x && x.kept) fill(nowStatus, el("b", {}, x.label), " · stays: " + x.kept);
    else if (x) fill(nowStatus, el("b", {}, x.label), " · " + (x.on ? destination(x) + (x.why ? " · " + x.why : "") : "stays: you unticked it"));
    else if (kept.length) fill(nowStatus, plural(kept.length, "change") + " blocked by the safety rules. Click a file to see why.");
    else fill(nowStatus, items.length ? "Untick a file to leave it where it is. Click it to see why." : "");
  }
  function destination(f) {
    if (f.bin) return "to the Recycle Bin";
    if (f.out != null) return "moves to " + f.out;
    if (!f.toDir) return f.as ? "renamed to " + f.as : "moves to " + where;
    return "moves to " + f.toDir.replaceAll("/", " › ") + (f.as ? ", renamed to " + f.as : "");
  }

  // After window
  const win = el("section", { class: "fv-win after" });
  const bar = el("div", { class: "fv-bar" }), body = el("div", { class: "fv-body" }), status = el("div", { class: "fv-status" });
  win.append(bar, body, status);
  const cols = el("div", { class: "fv-cols" }, now, el("div", { class: "fv-arrow", "aria-hidden": "true" }, "→"), win);

  const title = el("h1", { class: "fa-title" }), sub = el("p", { class: "fa-small fa-muted" });
  const words = r.text && !r.picked ? say("What the assistant says", r.text, null, seconds) : null;
  const note = el("div", { class: "fv-note", role: "alert" });
  const caution = el("div", { class: "fv-note", role: "status" });
  const actions = el("div");
  show(el("div", { class: "fv-head" }, title, sub), words, caution, cols, note, actions);

  const tiles = new Map();  // key -> [tile, status words]
  function select(k) {
    st.select = k;
    for (const [tk, [t]] of tiles) t.classList.toggle("sel", tk === k);
    const found = tiles.get(k);
    if (found) fill(status, found[1]);
    else fill(status, st.open ? "Click a file to see why it is here." : "Double-click a folder to look inside. Click anything to see why.");
  }
  function tile(k, kind, name, label, words, onOpen) {
    const t = el("button", { class: "fv-tile", type: "button", title: name }, icon(kind, 56), el("span", { class: "nm" }, name), label);
    t.addEventListener("click", () => select(k));
    if (onOpen) {
      t.addEventListener("dblclick", onOpen);
      t.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); onOpen(); } });
    }
    tiles.set(k, [t, words]);
    return t;
  }
  const pill = (cls, text) => el("span", { class: "fa-pill " + cls }, text);
  const small = text => el("span", { class: "sub" }, text);
  const b = text => el("b", {}, text);
  const goTo = folder => () => { st.open = folder; st.select = null; draw(); };

  function draw() {
    const a = after(), on = items.filter(f => f.on), n = on.length;
    const opened = st.open ? a.folders.find(d => d.name === st.open && d.items.length) : null;
    if (!opened) st.open = null;

    // Now list: where each file goes
    for (const f of items) {
      f.box.checked = f.on;
      f.row.classList.toggle("off", !f.on);
      if (!f.on) fill(f.to, "stays");
      else if (f.bin) fill(f.to, "→ ", el("span", { class: "fa-del" }, "Recycle Bin"));
      else if (f.out != null) fill(f.to, "→ " + lastPart(f.out.replace(/[\\/][^\\/]*$/, "")) + (f.as ? ", renamed" : ""));
      else if (!f.toDir) fill(f.to, f.as ? "renamed" : "→ " + here);
      else fill(f.to, "→ " + f.toDir.replaceAll("/", " › ") + (f.as ? ", renamed" : ""));
    }
    all.checked = n === items.length;
    all.indeterminate = n > 0 && n < items.length;
    drawNowStatus();

    // heading
    if (st.done) {
      title.textContent = "Done. This is " + here + " now.";
      sub.textContent = a.bin.length ? "Deleted files are in the Recycle Bin, and Undo puts everything back." : "Undo puts everything back.";
    } else {
      const tidy = items.some(f => f.toDir || f.as);
      title.textContent = !items.length ? "No changes to make" : "Here’s " + here + " after " + (tidy && !r.picked ? "tidying" : "the change");
      const before = ent.files.length + ent.folders.length;
      const become = [a.folders.length ? plural(a.folders.length, "folder") : "", plural(a.loose.length + a.stay.length, "file")];
      sub.textContent = !items.length ? "The safety rules stopped every change the assistant planned. Nothing on disk has changed."
        : r.picked ? r.text + " Nothing has changed yet."
        : (ent.folders.length ? plural(before, "item") : plural(before, "loose file")) + " become " + become.filter(Boolean).join(" and ") +
          ". Nothing has changed yet.";
    }
    cols.classList.toggle("done", !!st.done);
    if (words) words.hidden = !!st.done;
    const deletes = a.bin.length;
    fill(caution, !st.done && deletes >= 10 ? [el("b", { class: "fa-del" }, plural(deletes, "file") + " will go to the Recycle Bin."),
      " Check the list before you apply. Untick anything you want to keep."] : null);

    // After: path bar
    const back = el("button", { class: "fv-back", type: "button", "aria-label": "Back", onclick: goTo(null) }, "‹");
    back.disabled = !opened;
    const count = opened ? opened.items.length : a.folders.length + a.loose.length + a.stay.length;
    fill(bar, back, st.done ? null : el("span", { class: "which" }, "After"),
      el("div", { class: "fv-crumbs" }, el("button", { type: "button", onclick: goTo(null) }, here),
        opened ? [el("span", { class: "sep" }, "›"), el("span", {}, opened.name)] : null),
      el("span", { class: "grow" }), el("span", { class: "fa-small fa-muted" }, plural(count, "item")));

    // After: tiles. New folders first, then the files that stay, then the Recycle Bin line.
    tiles.clear();
    const grid = el("div", { class: "fv-grid" });
    if (opened) {
      for (const f of opened.items) {
        const deeper = f.toDir.split("/").slice(1).join(" › ");
        grid.append(tile("f:" + f.i, f.name, shown(f), f.as ? pill("renamed", "Renamed") : deeper ? small("in " + deeper) : null,
          [b(shown(f)), (f.as ? " · was " + f.name : " · from " + (f.fromHere ? here : lastPart(f.label.replace(/[\\/][^\\/]*$/, "")) || here)) +
            (f.why ? " · " + f.why : "")]));
      }
    } else {
      for (const d of a.folders) {
        const names = d.items.map(shown).join(", ");
        grid.append(tile("d:" + d.name, "folder", d.name,
          d.isNew ? pill("new", "New") : d.items.length ? small("+" + plural(d.items.length, "file")) : null,
          [b(d.name), d.isNew ? " · new folder · " + names : d.items.length ? " · gets " + names : " · already here, nothing moves in"],
          d.items.length ? goTo(d.name) : null));
      }
      for (const f of a.loose) {
        grid.append(tile("f:" + shown(f), f.name, shown(f), f.as ? pill("renamed", "Renamed") : st.done ? null : small("moves here"),
          [b(shown(f)), (f.as ? " · was " + f.name : " · from " + (lastPart(f.label.replace(/[\\/][^\\/]*$/, "")) || "elsewhere")) +
            (f.why ? " · " + f.why : "")]));
      }
      let plain = 0;
      for (const s of a.stay) {
        if (!s.f && !s.k && ++plain > 60) continue;  // a big folder: the untouched rest is counted below
        const why = s.k ? "stays: " + s.k.kept : s.f ? "stays: you unticked it" : "stays as it is";
        grid.append(tile("f:" + s.name, s.name, s.name, !st.done && (s.f || s.k) ? small("stays") : null, [b(s.name), " · " + why]));
      }
      if (plain > 60) grid.append(el("div", { class: "fv-empty", style: "grid-column:1/-1;padding:4px 6px" },
        "and " + plural(plain - 60, "more file") + " that stay as they are"));
    }
    const lines = [];
    if (!opened && a.out.length) {
      const dests = [...new Set(a.out.map(f => f.out.replace(/[\\/][^\\/]*$/, "")))];
      lines.push(el("div", { class: "fv-bin" }, icon("folder", 22),
        el("span", {}, el("b", {}, (st.done ? "Moved to " : "Moving to ") + dests.join(", ") + ": "),
          a.out.map(f => shown(f) + (f.why ? " (" + lower1(f.why) + ")" : "")).join(", "))));
    }
    if (!opened && a.bin.length) {
      lines.push(el("div", { class: "fv-bin" }, icon("bin", 22),
        el("span", {}, el("span", { class: "fa-del" }, st.done ? "In the Recycle Bin: " : "Going to the Recycle Bin: "),
          a.bin.map(f => f.label + (f.why ? " (" + lower1(f.why) + ")" : "")).join(", "))));
    }
    fill(body, grid.children.length ? grid : el("div", { class: "fv-empty" }, "Nothing here."), lines);
    select(st.select);

    // actions
    if (st.done) {
      const d = st.done;
      actions.className = "fv-done";
      fill(actions,
        el("span", { class: "grow" }, plural(d.moved + d.recycled, "change") + " applied to " + d.folder + ".",
          el("span", { class: "log", title: d.log }, "Undo log: " + d.log)),
        el("button", { class: "fa-btn", type: "button", onclick: undo }, "Undo"),
        el("button", { class: "fa-btn", type: "button", onclick: () => { home(); input.select(); input.focus(); } }, "New request"));
      return;
    }
    actions.className = "fv-actions";
    const into = on.filter(f => !f.bin && f.out == null && f.toDir);
    const used = new Set(into.map(f => key(f.toDir.split("/")[0])));
    const allNew = [...used].every(u => a.fresh.some(d => key(d.name) === u));
    const parts = [];
    if (into.length) parts.push(plural(into.length, "file") + " into " + plural(used.size, allNew ? "new folder" : "folder"));
    const arriving = on.filter(f => !f.bin && f.out == null && !f.toDir && !f.fromHere).length;
    if (arriving) parts.push(plural(arriving, "file") + " into " + here);
    if (a.out.length) parts.push(a.out.length + " moved out of " + here);
    const renamed = on.filter(f => f.as).length;
    if (renamed) parts.push(renamed + " renamed");
    if (a.bin.length) parts.push(a.bin.length + " to the Recycle Bin");
    const applyBtn = el("button", { class: "fa-btn primary", type: "button", onclick: apply }, n ? "Apply " + plural(n, "change") : "Nothing selected");
    applyBtn.disabled = !n;
    fill(actions,
      el("span", { class: "grow" }, el("b", {}, parts.join(" · ") || "Nothing selected"), n ? ". You can undo." : null),
      el("button", { class: "fa-btn", type: "button", onclick: () => { if (!busy) home(); } }, "Cancel"), applyBtn);

    async function apply() {
      if (busy) return;
      setBusy(true);
      applyBtn.disabled = true; applyBtn.textContent = "Applying…";
      fill(note);
      try {
        const x = await api("/api/apply", { selected: items.filter(f => f.on).map(f => f.i) });
        if (x.error) fill(note, el("b", {}, "Not applied. "), x.error);
        else { st.done = x; st.open = st.select = null; }
      } catch (e) {
        fill(note, el("b", {}, "The app is not answering. "), e.message);
      }
      setBusy(false);
      draw();
      window.scrollTo(0, 0);
    }
  }
  draw();
}

// ---- search results: tick files, then delete them or move them (with the same preview first)
function searchView(r, seconds) {
  if (!r.matches.length) return show(head("Nothing found", "Try other words, or name the folder: “find notes in downloads”."),
    r.text ? say("Assistant", r.text, r.folder, seconds) : null, newRequest());
  const on = new Set(), boxes = [];
  const note = el("div", { class: "fv-note", role: "alert" });
  const count = el("span", { class: "fa-small fa-muted" });
  const all = el("input", { type: "checkbox", class: "fa-check", "aria-label": "Select all" });
  const summary = el("span", { class: "grow" });
  const delBtn = el("button", { class: "fa-btn", type: "button" }, "Delete");
  const moveBtn = el("button", { class: "fa-btn", type: "button" }, "Move to");
  const target = el("input", { type: "text", class: "fa-input", placeholder: "a folder, e.g. Documents/CVs", "aria-label": "Folder to move to" });
  const update = () => {
    count.textContent = on.size + " of " + r.matches.length + " selected";
    delBtn.disabled = moveBtn.disabled = !on.size;
    delBtn.textContent = on.size ? "Delete " + plural(on.size, "file") : "Delete";
    all.checked = on.size === r.matches.length;
    all.indeterminate = on.size > 0 && on.size < r.matches.length;
    fill(summary, on.size ? [el("b", {}, plural(on.size, "file") + " ticked"), ". You’ll see the folder before anything changes."]
                          : "Tick files to delete them or move them to another folder.");
  };
  all.addEventListener("change", () => {
    for (const [box, i] of boxes) { box.checked = all.checked; all.checked ? on.add(i) : on.delete(i); }
    update();
  });
  const rows = r.matches.map(m => {
    const box = el("input", { type: "checkbox", class: "fa-check", "aria-label": "Pick " + m.name,
      onchange: e => { e.target.checked ? on.add(m.i) : on.delete(m.i); update(); } });
    boxes.push([box, m.i]);
    const open = el("button", { class: "fa-link", type: "button", onclick: e => {
      e.preventDefault();
      api("/api/open", { i: m.i }).then(x => fill(note, x.error ? [el("b", {}, "Couldn’t open the folder. "), x.error] : null))
        .catch(e => fill(note, el("b", {}, "The app is not answering. "), e.message));
    } }, "Show in folder");
    return el("li", {}, el("label", { class: "fv-row fv-res" }, box, icon(m.name, 22),
      el("span", { class: "body" }, el("span", { class: "nm" }, m.name),
        el("span", { class: "meta" }, [m.where, size(m.size_kb), m.modified, m.why].filter(Boolean).join(" · ")),
        m.snippet ? el("span", { class: "snippet" }, m.snippet) : null),
      open));
  });
  const act = async (action) => {
    if (busy) return;
    setBusy(true);
    fill(note);
    try {
      const x = await api("/api/act", { selected: [...on], action, to: target.value });
      if (x.error) fill(note, el("b", {}, "Nothing prepared. "), x.error);
      else result(x);
    } catch (e) {
      fill(note, el("b", {}, "The app is not answering. "), e.message);
    }
    setBusy(false);
  };
  delBtn.addEventListener("click", () => act("delete"));
  moveBtn.addEventListener("click", () => act("move"));
  target.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); act("move"); } });
  update();
  show(head("Files found", r.text || plural(r.matches.length, "file") + " match."),
    el("section", { class: "fv-win" },
      el("div", { class: "fv-bar" }, all, el("span", { class: "which" }, "Results"),
        r.folder ? el("span", { class: "fa-muted where", title: r.folder }, r.folder) : null, el("span", { class: "grow" }), count),
      el("ul", { class: "fv-list" }, rows),
      el("div", { class: "fv-status" }, seconds ? "Found " + seconds.replace("answered ", "") + ". Show in folder opens it in File Explorer."
                                                : "Show in folder opens it in File Explorer.")),
    note,
    el("div", { class: "fv-actions" }, summary, delBtn, target, moveBtn));
}

async function undo() {
  if (busy) return;
  setBusy(true);
  try {
    const r = await api("/api/undo");
    show(head(r.error ? "Undo failed" : "Undo last run", r.error || r.message), newRequest());
  } catch (e) {
    notAnswering(e);
  }
  setBusy(false);
}

document.getElementById("form").addEventListener("submit", e => { e.preventDefault(); send(); });
undoBtn.addEventListener("click", undo);

api("/api/info").then(r => {
  info = r;
  document.getElementById("sandbox").hidden = !r.sandbox;
  home();
}).catch(notAnswering);
home();
input.focus();
</script>
</body>
</html>
